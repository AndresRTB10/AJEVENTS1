# Perfil de PRODUCCIÓN (AWS). Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod
# Todos los valores sensibles vienen de variables de entorno (se configuran en Elastic Beanstalk).

# Elastic Beanstalk (plataforma Java) redirige el tráfico al puerto 5000
server.port=5000

# Base de datos (RDS MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:ajevents}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad (sin valor por defecto: si falta la variable, la app no arranca)
security.jwt.token.secret-key=${JWT_SECRET}

# Correo
spring.mail.password=${MAIL_PASSWORD}

# OpenAI (obligatoria: Spring AI exige una clave al arrancar)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# El cliente MCP usa Docker (dbhub), que no existe en Elastic Beanstalk
spring.ai.mcp.client.enabled=false

# URLs del frontend (Amplify)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${FRONTEND_URL}
