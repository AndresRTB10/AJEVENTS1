spring.application.name=event_management_system

# MYSQL
spring.datasource.url=jdbc:mysql://localhost:3307/AJEVENTS5?createDatabaseIfNotExist=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
security.jwt.token.secret-key=${JWT_SECRET:anything}

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ajeventsctg@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OPENAI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.mcp.client.enabled=true

spring.ai.mcp.client.stdio.connections.dbhub.command=docker
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.chat.options.max-tokens=500

spring.ai.openai.chat.request-timeout=120s
spring.ai.mcp.client.stdio.connections.dbhub.args=run,-i,--rm,bytebase/dbhub,--dsn,mysql://root:@host.docker.internal:3307/AJEVENTS5